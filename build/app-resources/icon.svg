<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- RouteSwitch app icon (source of icon.icns). One route that forks: Ethernet (left), Wi-Fi (right). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#3B3FC4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="64">
    <path d="M512 620 L702 430" stroke="#8FE3FF"/>
    <path d="M604 420 H724 V540" stroke="#8FE3FF"/>
    <path d="M512 752 V620 L322 430" stroke="#FFFFFF"/>
    <path d="M420 420 H300 V540" stroke="#FFFFFF"/>
  </g>
  <circle cx="512" cy="780" r="52" fill="#FFFFFF"/>
</svg>
